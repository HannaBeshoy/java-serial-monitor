name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the tests
        run: mvn -B verify
      - name: Keep the runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: java-serial-monitor-jar
          path: target/java-serial-monitor-*.jar
